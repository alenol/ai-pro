# LocalMind —— 编译 arm64 Release APK
#
# 运行环境：GitHub 托管的 ubuntu-latest（恰好 4 vCPU / 16 GB RAM，满足需求）。
# 触发：
#   - 推送 main 分支
#   - 推送 v* 标签（会自动把产物发布到 GitHub Release）
#   - 手动 workflow_dispatch
#
# 产物：app/build/outputs/apk/release/app-arm64-v8a-release.apk
#   （只编 arm64-v8a，见 app/build.gradle.kts 的 localmind.arm64Only）
#
# 签名（任选其一，不配置也能产出可安装的签名 APK）：
#   方式 A（推荐，稳定密钥）：在仓库 Settings → Secrets 中添加
#     SIGNING_KEY        base64 编码的 .jks 文件内容（echo -n "$(base64 release.jks)"）
#     KEYSTORE_PASSWORD  密钥库密码
#     KEY_ALIAS          别名
#     KEY_PASSWORD       Key 密码
#   方式 B（无密钥）：工作流自动用 keytool 生成一次性密钥库，保证 APK 已签名可安装；
#     但该密钥每次运行都不同，正式对外发布请用方式 A。

name: Build Release APK (arm64)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 发布 tag 时创建 GitHub Release
  actions: read

jobs:
  build:
    name: Build arm64 release APK
    runs-on: ubuntu-latest        # 4 vCPU / 16 GB RAM
    timeout-minutes: 120
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 安装 SDK cmdline-tools 并自动接受许可协议，再装所需组件
      - name: Install Android SDK, NDK 27, CMake
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973
            cmake;3.22.1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 准备签名密钥库：有 SIGNING_KEY 则用，否则用 keytool 生成一次性密钥库
      - name: Prepare signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          mkdir -p "$HOME/keystore"
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          [ -z "$STORE_PASS" ] && STORE_PASS="localmind"
          [ -z "$KEY_ALIAS" ]  && KEY_ALIAS="localmind"
          [ -z "$KEY_PASS" ]   && KEY_PASS="localmind"
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$HOME/keystore/release.jks"
          else
            keytool -genkeypair -v \
              -keystore "$HOME/keystore/release.jks" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=LocalMind"
          fi
          {
            echo "LM_SIGN_STORE_FILE=$HOME/keystore/release.jks"
            echo "LM_SIGN_STORE_PASSWORD=$STORE_PASS"
            echo "LM_SIGN_KEY_ALIAS=$KEY_ALIAS"
            echo "LM_SIGN_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      # 拉取 llama.cpp 源码到 third_party/（CMake 通过相对路径引用）
      - name: Fetch llama.cpp (third_party)
        run: bash ./scripts/fetch-llama-cpp.sh

      # 下载 Khronos OpenCL-Headers（ggml-opencl 后端 find_package(OpenCL) 需要）
      - name: Install OpenCL headers (Khronos)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/KhronosGroup/OpenCL-Headers/archive/refs/heads/main.tar.gz -o /tmp/opencl-headers.tar.gz
          rm -rf "$ANDROID_SDK_ROOT/opencl-headers"
          mkdir -p "$ANDROID_SDK_ROOT/opencl-headers"
          tar -xzf /tmp/opencl-headers.tar.gz -C "$ANDROID_SDK_ROOT/opencl-headers" --strip-components=1
          echo "OPENCL_HEADERS_DIR=$ANDROID_SDK_ROOT/opencl-headers" >> "$GITHUB_ENV"
          ls -l "$ANDROID_SDK_ROOT/opencl-headers/CL/cl.h"

      # 在 4 vCPU / 16 GB 限制下收一收 Gradle 内存与并发，避免 OOM
      - name: Tune Gradle for 4 vCPU / 16 GB
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=3"
          } >> gradle.properties

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 只编 arm64-v8a release；签名走上面的环境变量注入
      - name: Build release APK (arm64 only)
        run: gradle :app:assembleRelease -Plocalmind.arm64Only=true --no-daemon

      - name: List APK
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalMind-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
